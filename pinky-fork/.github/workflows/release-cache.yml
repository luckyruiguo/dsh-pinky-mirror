name: Release caches

# Builds the FFmpeg and adb that a release carries into the caches that
# release.yml restores, when they lack them. A release runs for its tag, and
# a tag's run restores only caches of that tag or of main, so the caches
# that release.yml saves for itself never serve the next release, which
# then builds both again, most of a release's time. This makes them on
# main instead, with the same builds (scripts/dist.sh
# prebuild, which runs what building a platform runs, STRICT) under
# release.yml's paths and keys: GitHub tells caches apart by their key and
# by a version made from their path, so a cache saved under another path
# is another cache. TestReleaseCaches (scripts/release) checks that the
# two files name the same ones.
#
# It runs when what the builds are made of changes on main, every day
# (GitHub evicts a cache that nothing restored for a week), by hand, and
# for the platform session's branches, so that a release run by hand there
# with publish off finds the builds of the branch's own scripts.
on:
  push:
    branches: [main, "claude/platform-*"]
    paths:
      - scripts/ffmpeg.sh
      - scripts/adb.sh
      - scripts/adb/**
      - scripts/dist.sh
      - .github/workflows/release.yml
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "23 20 * * *" # 04:23 in Asia/Shanghai, between releases
  workflow_dispatch:

# One run at a time for a branch, and none cancelled: a build cut short
# saves nothing, and the run that waits finds the caches filled.
concurrency:
  group: release-cache-${{ github.ref }}

permissions:
  contents: read

jobs:
  lookup:
    name: Look up the caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linux-windows: ${{ steps.ffmpeg-linux-windows.outputs.cache-hit != 'true' || steps.adb-linux-windows.outputs.cache-hit != 'true' }}
      macos: ${{ steps.ffmpeg-macos.outputs.cache-hit != 'true' || steps.adb-macos.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A cache's version is made from its path and its compression (zstd
      # on Ubuntu and macOS alike), not from the runner's system (Windows
      # aside), so this runner looks up the macOS caches too, and a macOS
      # runner starts only to build.
      - name: FFmpeg for Linux and Windows
        id: ffmpeg-linux-windows
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-windows-linux-${{ hashFiles('scripts/ffmpeg.sh') }}
          lookup-only: true
      - name: adb for Linux and Windows
        id: adb-linux-windows
        uses: actions/cache/restore@v6
        with:
          path: build/adb-dist
          key: adb-windows-linux-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
          lookup-only: true
      - name: FFmpeg for macOS
        id: ffmpeg-macos
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-macos-${{ hashFiles('scripts/ffmpeg.sh') }}
          lookup-only: true
      - name: adb for macOS
        id: adb-macos
        uses: actions/cache/restore@v6
        with:
          path: build/adb-dist
          key: adb-macos-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
          lookup-only: true

  # The jobs below make the caches as release.yml's jobs of the same names
  # do: the same runner, the same cache steps and tools, and the builds
  # that scripts/dist.sh would make there. Each cache step saves its
  # folder when the job passes, unless it restored it.
  linux-windows:
    name: Linux and Windows
    needs: lookup
    if: needs.lookup.outputs.linux-windows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-windows-linux-${{ hashFiles('scripts/ffmpeg.sh') }}
      - name: Cache adb
        uses: actions/cache@v6
        with:
          path: build/adb-dist
          key: adb-windows-linux-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
      - name: Build
        env:
          STRICT: "1"
          GH_TOKEN: ${{ github.token }} # scripts/adb.sh, when github.com's release downloads fail
        run: |
          scripts/dist.sh prebuild windows
          scripts/dist.sh prebuild linux

  macos:
    name: macOS
    needs: lookup
    if: needs.lookup.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-macos-${{ hashFiles('scripts/ffmpeg.sh') }}
      - name: Install nasm, for FFmpeg's Intel assembly
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: brew install --quiet nasm
      - name: Cache adb
        id: adb
        uses: actions/cache@v6
        with:
          path: build/adb-dist
          key: adb-macos-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
      - name: Install CMake, for adb
        if: steps.adb.outputs.cache-hit != 'true'
        run: command -v cmake >/dev/null || brew install --quiet cmake
      - name: Build
        env:
          STRICT: "1"
          GH_TOKEN: ${{ github.token }} # scripts/adb.sh, when github.com's release downloads fail
        run: scripts/dist.sh prebuild darwin
